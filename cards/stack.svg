<rect class="cf"  x="116" y="58" width="60" height="28" rx="14"/>
<text class="cft" x="146" y="77" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="middle">Java</text>
</g>

<g opacity="0" transform="translate(0, 15)">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.05 0.7 0.1 1" keyTimes="0;1"/>
