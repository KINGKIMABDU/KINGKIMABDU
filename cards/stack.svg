<rect class="cf"  x="184" y="58" width="100" height="28" rx="14"/>
<text class="cft" x="234" y="77" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="middle">HTML · CSS</text>
</g>

<g opacity="0" transform="translate(0, 15)">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.05 0.7 0.1 1" keyTimes="0;1"/>
