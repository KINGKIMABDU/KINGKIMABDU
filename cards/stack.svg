<text class="cft" x="412" y="77" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="middle">Git</text>
</g>

<!-- Row 2 -->
<g opacity="0" transform="translate(0, 15)">
