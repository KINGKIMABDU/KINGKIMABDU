<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
<style>
.bg{fill:#f4f7ee}
.ac{fill:#4e6837}
.cf{fill:#d9eabb}
.cft{fill:#152300}
.cob{fill:none;stroke:#b8c5a8;stroke-width:0.75}
.cot{fill:#44483d}
@media(prefers-color-scheme:dark){
  .bg{fill:#121510}
  .ac{fill:#b3d18e}
  .cf{fill:#1f3800}
  .cft{fill:#ceefac}
  .cob{stroke:#3d4836}
  .cot{fill:#c4c8bb}
}
</style>
<rect class="bg" width="800" height="150" rx="24"/>
<text class="ac" x="32" y="36" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="500" letter-spacing="1.5">STACK</text>

<!-- Row 1 -->
<g opacity="0" transform="translate(0, 15)">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.05 0.7 0.1 1" keyTimes="0;1"/>
<animateTransform attributeName="transform" type="translate" from="0 15" to="0 0" dur="0.8s" begin="0.1s" fill="freeze" calcMode="spline" keySplines="0.05 0.7 0.1 1" keyTimes="0;1"/>
<rect class="cf"  x="32" y="58" width="76" height="28" rx="14"/>
<text class="cft" x="70" y="77" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500" text-anchor="middle">Python</text>
</g>

<g opacity="0" transform="translate(0, 15)">
<animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.05 0.7 0.1 1" keyTimes="0;1"/>
