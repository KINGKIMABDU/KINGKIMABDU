<rect class="cob" x="32" y="98" width="80" height="28" rx="14"/>
<text class="cot" x="72" y="117" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" text-anchor="middle">VS Code</text>
</g>
</svg>
